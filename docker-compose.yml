version: '3.4'
services:
  bitcoincore.avado.dnp.dappnode.eth:
    image: 'bitcoincore.avado.dnp.dappnode.eth:0.1.1'
    build:
      context: .
      dockerfile: build/Dockerfile
    volumes:
      - 'bitcoincore:/data'
    ports:
      - '8333:8333'
    environment:
      - MODE=auto
      - PRUNE_GB=10
      - FULL_NODE_MIN_FREE_GB=1500
      - DBCACHE_MB=1000
      - EXTRA_OPTS=
    restart: always
volumes:
  bitcoincore: {}
